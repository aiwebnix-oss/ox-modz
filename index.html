            color: var(--text-dim); transition: transform 0.2s, border-color 0.2s, color 0.2s, background 0.2s;
        }
        .social-link svg { width: 20px; height: 20px; fill: currentColor; }
        .social-link:hover { transform: translateY(-2px); border-color: var(--text-dim); color: var(--text); background: var(--surface-2); }
        .footer-copy { font-size: 0.78rem; color: var(--text-dim); font-family: var(--mono); letter-spacing: 0.6px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 10px; }

        @media (max-width: 600px) {
            .container { padding: 20px 14px 0; }
            .header-btn { padding: 8px 11px; font-size: 0.78rem; }
            .hero-strip { padding: 14px 16px; }

            .stat-v { font-size: 0.98rem; }
            .page-btn { width: 36px; height: 36px; font-size: 0.82rem; }
            .footer-links { gap: 16px; }
        }

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script>
        (() => {
            'use strict';

            /* ---------- UTILITY: Escape HTML ---------- */
            function escapeHtml(str) {
                if (str == null) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            /* ---------- FIREBASE INIT ---------- */
            if (typeof firebase === 'undefined') {
                showFatalError('Connection problem', 'Firebase scripts could not load. Please disable any ad-blocker, check your internet connection, and reload the page.');
                return;
            }

            const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            /* ---------- DOM REFS ---------- */
            const el = {
                errorOverlay: document.getElementById('loader-overlay'),
                list: document.getElementById('app-list'),
                pagination: document.getElementById('pagination'),
                search: document.getElementById('search-input'),
                drop: document.getElementById('category-dropdown'),
                dropVal: document.getElementById('selected-category'),
                dropItems: document.querySelectorAll('.dropdown-item'),
                details: document.getElementById('details-overlay'),
                btnGrid: document.getElementById('view-grid-btn'),
                btnList: document.getElementById('view-list-btn')
            };

            /* ---------- STATE ---------- */
            let sortedAppEntries = [];
            let currentCat = 'All';
            let currentPage = 1;
            const ITEMS_PER_PAGE = 8;
            let dataLoaded = false;

            /* ---------- ERROR HANDLING ---------- */
            function showFatalError(title, description) {
                const overlay = el.errorOverlay;
                overlay.innerHTML =
                    '<div class="error-glass-card">' +
                    '<div class="err-icon">⚠️</div>' +
                    '<div class="err-title">' + escapeHtml(title) + '</div>' +
                    '<div class="err-desc">' + escapeHtml(description) + '</div>' +
                    '<button class="err-btn primary" onclick="location.reload()">Reload</button>' +
                    '<button class="err-btn ghost" onclick="document.getElementById(\'loader-overlay\').style.display=\'none\'">Continue anyway</button>' +
                    '</div>';
                overlay.style.display = 'flex';
            }

            const errorWatchdog = setTimeout(() => {
                if (!dataLoaded) showFatalError('Loading timeout', 'The app data is taking longer than expected. Please check your connection and reload.');
            }, 12000);

            /* ---------- SKELETON LOADING ---------- */
            function renderSkeletons(viewClass) {
                el.list.innerHTML = '';
                const frag = document.createDocumentFragment();
                for (let i = 0; i < 8; i++) {
                    const card = document.createElement('div');
                    card.className = 'app-card skeleton-card';
                    if (viewClass === 'list-view') {
                        card.innerHTML =
                            '<div class="card-logo-zone"><div class="sk-img"></div></div>' +
                            '<div class="sk-lines">' +
                            '<div class="sk-line" style="width:70%;"></div>' +
                            '<div class="sk-line short" style="width:45%;"></div>' +
                            '<div class="sk-badge" style="width:30%;"></div>' +
                            '</div>';
                    } else {
                        card.innerHTML =
                            '<div class="sk-img"></div>' +
                            '<div class="sk-line" style="width:80%;"></div>' +
                            '<div class="sk-line short" style="width:55%;"></div>' +
                            '<div class="sk-badge" style="width:45%; margin-top:8px;"></div>';
                    }
                    frag.appendChild(card);
                }
                el.list.appendChild(frag);
            }

            /* ---------- OBSERVERS ---------- */
            const imgObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.onload = () => img.classList.add('loaded');
                        img.onerror = () => img.classList.add('loaded');
                        imgObserver.unobserve(img);
                    }
                }
            }, { rootMargin: '120px' });

            const cardObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        cardObserver.unobserve(entry.target);
                    }
                }
            }, { rootMargin: '60px' });

            /* ---------- PRESS INTERACTION ---------- */
            function addPress(card) { card.classList.add('card-press'); }
            function removePress(card) { card.classList.remove('card-press'); }
            function clearAllPress() {
                el.list.querySelectorAll('.app-card.card-press').forEach(c => c.classList.remove('card-press'));
            }

            el.list.addEventListener('mousedown', e => {
                const card = e.target.closest('.app-card');
                if (card && !card.classList.contains('skeleton-card')) addPress(card);
            });
            el.list.addEventListener('mouseup', () => clearAllPress());
            el.list.addEventListener('mouseleave', () => clearAllPress());
            el.list.addEventListener('touchstart', e => {
                const card = e.target.closest('.app-card');
                if (card && !card.classList.contains('skeleton-card')) addPress(card);
            }, { passive: true });
            el.list.addEventListener('touchend', () => clearAllPress());
            el.list.addEventListener('touchcancel', () => clearAllPress());

            /* ---------- RENDER ---------- */
            function render() {
                requestAnimationFrame(() => {
                    el.list.innerHTML = '';
                    const term = el.search.value.toLowerCase();
                    const filtered = sortedAppEntries.filter(([, app]) =>
                        (currentCat === 'All' || app.category === currentCat) &&
                        app.title.toLowerCase().includes(term)
                    );

                    if (!filtered.length) {
                        el.list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);margin-top:20px;padding:40px;">No results found.</div>';
                        el.pagination.innerHTML = '';
                        return;
                    }

                    const totalItems = filtered.length;
                    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
                    if (currentPage < 1) currentPage = 1;
                    if (currentPage > totalPages) currentPage = totalPages;

                    const start = (currentPage - 1) * ITEMS_PER_PAGE;
                    const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);
                    const isListView = el.list.classList.contains('list-view');

                    const frag = document.createDocumentFragment();
                    pageItems.forEach(([id, app]) => {
                        const safeTitle = escapeHtml(app.title);
                        const safeSub = escapeHtml(app.subtitle || 'Premium');
                        const safeSize = escapeHtml(app.size || 'N/A');
                        const safeCat = escapeHtml(app.category || 'App');
                        const safeAlt = escapeHtml(app.title);

                        const imgTag =
                            '<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="' +
                            app.logoUrl + '" alt="' + safeAlt + '" loading="lazy" width="64" height="64">';
                        const infoBlock =
                            '<div class="app-info"><div class="app-title">' + safeTitle +
                            '</div><div class="app-sub">' + safeSub +
                            '</div><div class="app-meta"><span class="app-badge">' + safeSize +
                            '</span><span class="app-badge">' + safeCat + '</span></div></div>';

                        const div = document.createElement('div');
                        div.className = 'app-card';
                        div.dataset.id = id;
                        if (isListView) {
                            div.innerHTML = '<div class="card-logo-zone">' + imgTag + '</div><div class="card-perf"></div>' + infoBlock;
                        } else {
                            div.innerHTML = imgTag + infoBlock;
                        }
                        frag.appendChild(div);
                        imgObserver.observe(div.querySelector('img'));
                        cardObserver.observe(div);
                    });
                    el.list.appendChild(frag);

                    if (totalItems <= 8) {
                        el.pagination.innerHTML = '';
                    } else {
                        renderPagination(totalPages, currentPage);
                    }
                });
            }

            /* ---------- PAGINATION RENDERING ---------- */
            function renderPagination(totalPages, currentPage) {
                el.pagination.innerHTML = '';
                if (totalPages <= 1) return;

                const createBtn = (content, page, disabled = false, isActive = false) => {
                    const btn = document.createElement('button');
                    btn.className = 'page-btn';
                    if (typeof content === 'string') {
                        btn.innerHTML = content;
                    } else {
                        btn.appendChild(content);
                    }
                    if (isActive) btn.classList.add('active');
                    if (disabled) btn.disabled = true;
                    if (!disabled && page !== null) {
                        btn.addEventListener('click', () => goToPage(page));
                    }
                    return btn;
                };

                if (currentPage > 2) {
                    const firstSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    firstSvg.setAttribute('viewBox', '0 0 24 24');
                    firstSvg.innerHTML = '<path d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6zM6 6h2v12H6z"/>';
                    el.pagination.appendChild(createBtn(firstSvg, 1));
                }

                const prevSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                prevSvg.setAttribute('viewBox', '0 0 24 24');
                prevSvg.innerHTML = '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>';
                el.pagination.appendChild(createBtn(prevSvg, currentPage - 1, currentPage === 1));

                const maxVisible = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage + 1 < maxVisible) startPage = Math.max(1, endPage - maxVisible + 1);

                if (startPage > 1) {
                    el.pagination.appendChild(createBtn('1', 1));
                    if (startPage > 2) {
                        const dots = document.createElement('span');
                        dots.textContent = '…';
                        dots.style.padding = '0 4px';
                        dots.style.color = 'var(--text-dim)';
                        el.pagination.appendChild(dots);
                    }
                }
                for (let i = startPage; i <= endPage; i++) {
                    el.pagination.appendChild(createBtn(i.toString(), i, false, i === currentPage));
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        const dots = document.createElement('span');
                        dots.textContent = '…';
                        dots.style.padding = '0 4px';
                        dots.style.color = 'var(--text-dim)';
                        el.pagination.appendChild(dots);
                    }
                    el.pagination.appendChild(createBtn(totalPages.toString(), totalPages));
                }

                const nextSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                nextSvg.setAttribute('viewBox', '0 0 24 24');
                nextSvg.innerHTML = '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>';
                el.pagination.appendChild(createBtn(nextSvg, currentPage + 1, currentPage === totalPages));

                if (currentPage < totalPages - 1) {
                    const lastSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    lastSvg.setAttribute('viewBox', '0 0 24 24');
                    lastSvg.innerHTML = '<path d="M5.59 7.41L10.18 12l-4.59 4.59L7 18l6-6-6-6zM16 6h2v12h-2z"/>';
                    el.pagination.appendChild(createBtn(lastSvg, totalPages));
                }
            }

            function goToPage(page) {
                currentPage = page;
                render();
                requestAnimationFrame(() => {
                    const listTop = el.list.getBoundingClientRect().top + window.scrollY - 100;
                    window.scrollTo({ top: listTop, behavior: 'smooth' });
                });
            }

            /* ---------- EVENT LISTENERS ---------- */
            el.search.addEventListener('input', debounce(() => { currentPage = 1; render(); }, 280));

            el.drop.addEventListener('click', e => { e.stopPropagation(); el.drop.classList.toggle('active'); });
            el.dropItems.forEach(item => {
                item.addEventListener('click', e => {
                    currentCat = e.target.dataset.value;
                    el.dropVal.textContent = e.target.textContent;
                    el.dropItems.forEach(x => x.classList.remove('selected'));
                    e.target.classList.add('selected');
                    currentPage = 1;
                    render();
                });
            });
            window.addEventListener('click', () => el.drop.classList.remove('active'));

            el.list.addEventListener('click', e => {
                const card = e.target.closest('.app-card');
                if (!card || card.classList.contains('skeleton-card')) return;
                openDetails(card.dataset.id);
            });

            el.details.addEventListener('click', e => { if (e.target === el.details) el.details.classList.remove('active'); });
            document.getElementById('close-details').addEventListener('click', () => el.details.classList.remove('active'));
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && el.details.classList.contains('active')) el.details.classList.remove('active');
            });

            function openDetails(id) {
                const app = sortedAppEntries.find(([i]) => i === id)?.[1];
                if (!app) return;
                document.getElementById('popup-logo').src = app.logoUrl;
                document.getElementById('popup-title').innerText = app.title;
                document.getElementById('popup-subtitle').innerText = app.subtitle || 'Premium';
                document.getElementById('popup-downloads').innerText = app.downloads || '1K+';
                document.getElementById('popup-size').innerText = app.size || 'N/A';
                document.getElementById('popup-version').innerText = app.version || 'Latest';
                document.getElementById('popup-rating').innerText = (app.rating || '4.5') + '\u2605';
                document.getElementById('popup-download-btn').onclick = () => {
                    window.open(app.downloadLink, '_blank', 'noopener');
                    el.details.classList.remove('active');
                };
                el.details.classList.add('active');
            }

            /* ---------- VIEW SWITCHER ---------- */
            function setupViewSwitcher() {
                const savedView = localStorage.getItem('appView') || 'list-view';
                setView(savedView);
                el.btnGrid.addEventListener('click', () => setView('grid-view'));
                el.btnList.addEventListener('click', () => setView('list-view'));
            }
            function setView(v) {
                el.list.className = v;
                el.btnList.classList.toggle('active', v === 'list-view');
                el.btnGrid.classList.toggle('active', v === 'grid-view');
                localStorage.setItem('appView', v);
                dataLoaded ? render() : renderSkeletons(v);
            }

            /* ---------- DEBOUNCE ---------- */
            function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

            /* ---------- INIT ---------- */
            function init() {
                const savedView = localStorage.getItem('appView') || 'list-view';
                el.list.className = savedView;
                renderSkeletons(savedView);

                db.ref('settings').once('value', snap => {
                    const s = snap.val();
                    if (s) {
                        document.getElementById('header-name').innerText = s.name;
                        document.getElementById('header-logo').src = s.logoUrl;
                        localStorage.setItem('cachedAdminLogo', s.logoUrl);
                    }
                }, err => console.error('Settings read failed:', err.message));

                db.ref('apps').once('value', snap => {
                    const data = snap.val() || {};
                    const entries = Object.entries(data).map(([id, app]) => {
                        app._randOrder = Math.random();
                        return [id, app];
                    });
                    entries.sort((a, b) => a[1]._randOrder - b[1]._randOrder);
                    sortedAppEntries = entries;
                    dataLoaded = true;
                    clearTimeout(errorWatchdog);
                    render();
                }, err => {
                    console.error('Apps read failed:', err.message);
                    showFatalError('Could not load app data',
                        'The database could not be reached. This may happen if Firebase rules do not allow public read access, or if your internet connection is unstable. Please try reloading.');
                });

                setupViewSwitcher();
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
